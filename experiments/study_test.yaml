schema: study/v1
study_name: tinycnn_dropout
out_dir: "runs/"
seed: 0
metric: val/acc   # ensure these are not flagged as "not in runtime cfg"
goal: "max"

 
epochs: 1
device: null     # auto
deterministic: true
clean_run: false


data:
  dataset: cifar10
  subset: 256
  batch_size: 128
  num_workers: 0
  pin_memory: false

model:
  name: tinycnn
  hidden: 64
  dropout: 0.0

optim:
  optimizer: adam
  lr: 0.001
  wd: 0.0
  momentum: 0.9

sched:
  name: cosine

ema:
  enabled: false
  decay: 0.9999


variants:
  - name: "without_dropout"
    overrides: {model: {dropout: 0.0}}
  - name: "with_dropout"
    overrides: {model: {dropout: 0.3}}



# third party logging cfg (ingore if no-op)

logging:
  enable: true
  backends: ["tensorboard"]   # or ["tensorboard","wandb"]
  log_every_n_steps: 1
  wandb:
    mode: offline
    project: ablation-harness
    run_name: null
    tags: ["wk3","dropout"]
    notes: "seed repeats v1"
  tensorboard:
    flush_secs: 10
