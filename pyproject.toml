[project]
name = "ablation-harness"
version = "0.0.0"
description = "Ablation harness + reproducibility template"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2.0",
    "omegaconf>=2.3",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    ]

[project.scripts]
ablation-harness = "ablation_harness.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ablation_harness*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "ruff>=0.5",
    "black>=24.8",
    "isort>=5.13",
    "tensorboard",
    "wandb",
    ]

torch-cpu = [
    "torch>=2.3", "torchvision>=0.18", "torchaudio>=2.3"
]

[tool.black]
line-length = 200

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 200
lint.select = ["E","F","C90"]
lint.ignore = ["F841"]
